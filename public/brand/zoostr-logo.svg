  <text x="512" y="800" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="28" letter-spacing="11" fill="#8fa3b8">CREATOR HEARTH</text>
  <circle cx="512" cy="868" r="5" fill="#ff8c42"/>
